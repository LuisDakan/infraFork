# Config file for blackbox exporter
# Modules for probing endpoints

modules:
  https_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2"]
      valid_status_codes: []  # Defaults to 2xx
      method: GET
      no_follow_redirects: false
      preferred_ip_protocol: "ip4"
      skip_resolve_phase_with_proxy: false
      tls_config:
        insecure_skip_verify: false

  https_4xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2"]
      valid_status_codes: [400, 401, 403, 404]
      method: GET
      preferred_ip_protocol: "ip4"

  https_cert_check:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2"]
      method: GET
      tls_config:
        insecure_skip_verify: false