---
# Set up observability services
# Installation section

- name: Installing prometheus and podman
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - prometheus
    - podman
    - nginx

# Configuration for podman

- name: Enable lingering for Podman rootless mode
  ansible.builtin.shell:
    cmd: loginctl enable-linger {{ ansible_user }}
  become: true
  ignore_errors: yes


# Deploying blackbox exporter

- name: Ensure blackbox directory exists
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    mode: '0755'
    owner: root
    group: root   

- name: Copy blackbox exporter configuration
  ansible.builtin.copy:
    src: files/prometheus/mirror/blackbox-exporter/conf.yaml
    dest: /etc/blackbox_exporter/config.yml
    mode: '0644'

- name: Deploying docker blackbox exporter
  containers.podman.podman_container:
    name: blackbox_exporter
    image: quay.io/prometheus/blackbox-exporter:latest
    state: started
    restart_policy: always
    published_ports:
      - "9115:9115"
    volumes:
      - /etc/blackbox_exporter/config.yml:/etc/blackbox_exporter/config.yml:ro
    command: "--config.file=/etc/blackbox_exporter/config.yml"

# Deploying nginx exporter

- name: Add nginx stub module
  ansible.builtin.copy:
    src: files/prometheus/nginx-exporter/status.conf
    dest: /etc/nginx/conf.d/status.conf
    mode: '0644'

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
    state: reloaded

- name: Deploy nginx_exporter
  containers.podman.podman_container:
    name: nginx_exporter
    image: docker.io/nginx/nginx-prometheus-exporter:latest
    state: started
    restart_policy: always
    published_ports:
      - "9113:9113"
    command: "-nginx.scrape-uri http://127.0.0.1/nginx_status"

# Deploying Tor metrics exporter

- name: Configure Tor MetricsPort in torrc
  ansible.builtin.lineinfile:
    path: /etc/tor/torrc
    regexp: "^MetricsPort"
    line: "MetricsPort 127.0.0.1:9150"
    state: present
  become: true

- name: Configure Tor MetricsPortPolicy in torrc
  ansible.builtin.lineinfile:
    path: /etc/tor/torrc
    regexp: "^MetricsPortPolicy"
    line: "MetricsPortPolicy accept 127.0.0.1"
    state: present
  become: true

# Firewall configuration (It's already in the nftable.conf)

- name: Create temporary in-memory Tor nftables structure
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - "nft add table inet tor"
    - "nft add chain inet tor input { type filter hook input priority 0 ; policy accept ; }"
  # This prevents Ansible from throwing an error if the table already exists
  failed_when: false 

- name: Configure in-memory Tor metrics firewall rules
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - "nft add rule inet tor input iif 'lo' accept"
    - "nft add rule inet tor input tcp dport { 9035, 9150 } drop"
  changed_when: true

- name: Restart nftable service
  ansible.builtin.command:
    name: nftables
    state: reloaded

- name: Restart Tor service
  ansible.builtin.systemd:
    name: tor
    state: restarted
    enabled: yes
  become: true
  
# Export metrics

# Rule configuration
- name: Making rule directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    mode: '0755'
    owner: root
    group: root 

- name: Copying the mirror rule file
  ansible.builtin.copy:
    src: files/prometheus/mirror/rules.yaml
    dest: /etc/prometheus/rules/mirror_rules.yaml
    mode: '0644'  


# Prometheus configuration

- name: Writing prometheus config file
  ansible.builtin.copy:
    src: files/prometheus/prometheus.yaml
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'

- name: Ensure prometheus service is enabled and started
  ansible.builtin.systemd:
    name: prometheus
    enabled: yes
    state: reloaded



